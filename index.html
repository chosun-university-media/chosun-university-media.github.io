<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>조선대학교 언론 관리 플랫폼</title>
    <link rel="icon" href="./assets/chosun-symbol-basic.jpg" />
    <link rel="stylesheet" href="./styles.css?v=20260724-nav-badge-v5" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" aria-label="주요 메뉴">
        <button class="brand" type="button" data-action="go-home" aria-label="한눈에 보기로 이동">
          <img src="./assets/chosun-symbol-basic.jpg" alt="조선대학교 로고" class="brand-symbol-only" />
          <div class="brand-copy">
            <strong>조선대학교</strong>
            <span>언론 관리 플랫폼</span>
          </div>
        </button>
        <nav id="nav" class="nav-list"></nav>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="title-block">
            <p id="eyebrow">홍보팀 운영 콘솔</p>
            <h1 id="page-title">대시보드</h1>
          </div>
          <div class="topbar-actions">
            <label class="search-box" for="global-search">
              <span aria-hidden="true">⌕</span>
              <input id="global-search" type="search" placeholder="전체 검색" autocomplete="off" />
            </label>
            <button class="icon-button" type="button" data-action="export-backup" title="전체 백업" aria-label="전체 백업">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"/></svg>
            </button>
          </div>
        </header>

        <main id="view" class="view" tabindex="-1"></main>
      </div>
    </div>

    <div id="modal-root" class="modal-root" aria-live="polite"></div>
    <div id="toast-root" class="toast-root" aria-live="polite"></div>
    <input id="backup-import" type="file" accept="application/json" hidden />
    <script src="./app.js?v=20260724-nav-badge-v5"></script>
  </body>
</html>
